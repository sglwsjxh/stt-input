[package]
name = "stt-input"
version = "0.1.0"
edition = "2024"
description = "A voice input method based on the MAI STT service"
license = "GPL-3.0-or-later"

[[bin]]
name = "stt-input"
path = "main.rs"

[dependencies]
cpal = "0.18.2"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
native-tls = "0.2.18"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
hound = "3.5.1"
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Foundation",
] }
